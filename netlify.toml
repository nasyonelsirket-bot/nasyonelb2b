[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit"
  SITE_URL = "https://nasyoneltoys.com"
  VITE_SITE_URL = "https://nasyoneltoys.com"

[functions]
  node_bundler = "esbuild"
  included_files = ["lib/**", "lib/fonts/**"]

[functions."paytr-callback"]
  timeout = 26

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/api/feed/products.xml"
  to = "/.netlify/functions/product-feed"
  status = 200
  force = true

[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/product-feed"
  status = 200
  force = true

# HTTPS yönlendirme
[[redirects]]
  from = "http://nasyoneltoys.com/*"
  to = "https://nasyoneltoys.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.nasyoneltoys.com/*"
  to = "https://www.nasyoneltoys.com/:splat"
  status = 301
  force = true

# Trendyol API — SPA yönlendirmesinden ÖNCE olmalı
