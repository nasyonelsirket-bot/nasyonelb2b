# PayTR iFrame — müşteri dönüş URL'leri (merchant_ok_url / merchant_fail_url)
[[redirects]]
  from = "/odeme/basarili"
  to = "/.netlify/functions/paytr-return-ok"
  status = 200
  force = true
  conditions = {Method = ["POST"]}

[[redirects]]
  from = "/odeme/basarisiz"
  to = "/.netlify/functions/paytr-return-fail"
  status = 200
  force = true
  conditions = {Method = ["POST"]}

[[redirects]]
  from = "/odeme/hata"
  to = "/.netlify/functions/paytr-return-fail"
  status = 200
  force = true
  conditions = {Method = ["POST"]}

[[redirects]]
  from = "/api/members/orders"
  to = "/.netlify/functions/members-orders"
  status = 200
  force = true

# Eksik statik asset — SPA fallback yerine 404 (HTML as JS MIME hatasını önler)
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.js"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.css"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.mjs"
  to = "/404.html"
  status = 404

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/api/catalog"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=300, stale-while-revalidate=600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://www.paytr.com\" \"https://paytr.com\")"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net https://www.paytr.com https://paytr.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.paytr.com https://paytr.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://region1.google-analytics.com https://connect.facebook.net https://www.facebook.com https://api.ipify.org https://www.paytr.com https://paytr.com https://api.paytr.com; frame-src 'self' https://www.paytr.com https://paytr.com https://api.paytr.com https:; child-src 'self' https://www.paytr.com https://paytr.com https://api.paytr.com https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://www.paytr.com https://paytr.com; upgrade-insecure-requests"

# Ödeme sayfası — 3D Secure banka iframe'leri için frame-src https: (PayTR + ACS bankaları)
[[headers]]
  for = "/odeme"
  [headers.values]
  Cross-Origin-Opener-Policy = "same-origin-allow-popups"
  Cross-Origin-Resource-Policy = "cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://www.paytr.com\" \"https://paytr.com\" *), storage-access=(self \"https://www.paytr.com\" \"https://paytr.com\" *)"
  Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net https://www.paytr.com https://paytr.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.paytr.com https://paytr.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://region1.google-analytics.com https://connect.facebook.net https://www.facebook.com https://api.ipify.org https://www.paytr.com https://paytr.com https://api.paytr.com; frame-src 'self' https://www.paytr.com https://paytr.com https://api.paytr.com https:; child-src 'self' https://www.paytr.com https://paytr.com https://api.paytr.com https: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://www.paytr.com https://paytr.com https:; upgrade-insecure-requests"

[[headers]]
  for = "/odeme/*"
  [headers.values]
  Cross-Origin-Opener-Policy = "same-origin-allow-popups"
  Cross-Origin-Resource-Policy = "cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://www.paytr.com\" \"https://paytr.com\" *), storage-access=(self \"https://www.paytr.com\" \"https://paytr.com\" *)"
  Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net https://www.paytr.com https://paytr.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.paytr.com https://paytr.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://region1.google-analytics.com https://connect.facebook.net https://www.facebook.com https://api.ipify.org https://www.paytr.com https://paytr.com https://api.paytr.com; frame-src 'self' https://www.paytr.com https://paytr.com https://api.paytr.com https:; child-src 'self' https://www.paytr.com https://paytr.com https://api.paytr.com https: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://www.paytr.com https://paytr.com https:; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
