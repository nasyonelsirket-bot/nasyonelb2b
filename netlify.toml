[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit"

[functions]
  node_bundler = "esbuild"
  included_files = ["lib/**", "lib/fonts/**"]

[[redirects]]
  from = "/api/feed/products.xml"
  to = "/.netlify/functions/product-feed"
  status = 200
  force = true

# HTTPS yönlendirme
[[redirects]]
  from = "http://nasyoneltoys.com/*"
  to = "https://nasyoneltoys.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.nasyoneltoys.com/*"
  to = "https://www.nasyoneltoys.com/:splat"
  status = 301
  force = true

# Trendyol API — SPA yönlendirmesinden ÖNCE olmalı
[[redirects]]
  from = "/api/trendyol/sync"
  to = "/.netlify/functions/trendyol-sync"
  status = 200
  force = true

[[redirects]]
